
# all our containers are going to be services.
#customesided network of docker bridge no the the default bridge network.
#now, ikkada, docker network bridge customised ga kuda ide create cheya galadu ana mata, so ippudu, docker compose  execute chesinappudu, it will create, [docker network create roboshop] , for all the services inside this docker-compose.yaml file
networks:
  default:
    driver: bridge
    name: roboshop
    #external: true # I created the network already using [docker network create roboshop]-> customised bridge network, so by marking the network as external:


services:
  mongodb:
    image: gangineninaveen/mongodb:v1
    container_name: mongodb

  catalogue:
    image: gangineninaveen/catalogue:v1
    container_name: catalogue
    depends_on:
    - mongodb # dependens on ,[service file, if i check, i will get to know the dependencies.] we can create one or many.

  redis:
    image: redis:7.0
    container_name: redis
    

  user:
    image: gangineninaveen/user:v1
    container_name: user
    depends_on:
    - redis
    - mongodb


  cart:
    image: gangineninaveen/cart:v1
    container_name: cart
    depends_on:
    - catalogue
    - redis

  mysql:
    image: gangineninaveen/mysql:v1
    container_name: mysql
    
  shipping:
    image: gangineninaveen/shipping:v1
    container_name: shipping
    depends_on:
    - mysql
    - cart

# rabbitmq , lo manam emi, data load cheyam kabbati, direct ga internet, nunchi pull chesta, same like redis.
  rabbitmq:
    image: rabbitmq:3 # taking official rabbitmq docker image from docker hub
    container_name: rabbitmq
    # more info in official image [https://hub.docker.com/_/rabbitmq]
    #environment details in docker compose[https://docs.docker.com/compose/how-tos/environment-variables/set-environment-variables/] for below details
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123


  # payment details and enviroment variables
  payment:
    image: gangineninaveen/payment:v1
    container_name: payment
    environment:
      CART_HOST: cart
      CART_PORT: 8080
      USER_HOST: user
      USER_PORT: 8080
      AMQP_HOST: rabbitmq
      AMQP_USER: roboshop
      AMQP_PASS: roboshop123
    depends_on:
    - cart
    - user
    - rabbitmq



