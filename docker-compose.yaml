
#the below is customised brid ge network.
# all our containers are going to be services.
#customesided network of docker bridge network, [not the the default bridge network.]
#now, ikkada, docker network bridge customised ga kuda ide create cheya galadu ana mata, so ippudu, docker compose  execute chesinappudu, it will create, [docker network create roboshop] , for all the services inside this docker-compose.yaml file
networks:
  default:
    driver: bridge
    name: roboshop
    #external: true # I created the network already using [docker network create roboshop]-> customised bridge network, so by marking the network as external:

#volumes -> named volumes -> docker will create the host path.[so aa host path lo user data anedi store chesukuntundi, back up kosam.]
#mainly for databases.
volumes:
  mongodb:
  redis:
  mysql:
  rabbitmq: # ila voulme kinda icham ante-> [docker volume create rabbitmq] ani, so volume create chesunti docker vachesi rabbitmq ki ani.

services:
  mongodb:
    image: gangineninaveen/mongodb:v1
    container_name: mongodb
    volumes:
    - mongodb:/data/db  # [mongodb-> Volume peru (host side, Docker host path decide chestundi)] and [/data/db -> Container path (container lopala folder lopala data store avtundi) -> Docker Hub official image page -> container path untundi -> hub.docker.com/_/mongo lo “Where to Store Data” ane section untundi. Adi data directory path chebutundi. MySQL, PostgreSQL, Redis official pages lo kuda same section untundi ]

  catalogue:
    image: gangineninaveen/catalogue:v1
    container_name: catalogue
    depends_on:
    - mongodb # dependens on ,[service file, if i check, i will get to know the dependencies.] we can create one or many.

  redis:
    image: redis:7.0
    container_name: redis
    volumes:
    - redis:/data #[redis-> volume name-> docker vachesi host path decide chestundi, and [/data -> anedi container path, manam decide chestam, official image chusi docker hub lo]
    

  user:
    image: gangineninaveen/user:v1
    container_name: user
    depends_on:
    - redis
    - mongodb


  cart:
    image: gangineninaveen/cart:v1
    container_name: cart
    depends_on:
    - catalogue
    - redis

  mysql:
    image: gangineninaveen/mysql:v1
    container_name: mysql
    volumes:
    - mysql:/var/lib/mysql
    
  shipping:
    image: gangineninaveen/shipping:v1
    container_name: shipping
    depends_on:
    - mysql
    - cart

# rabbitmq , lo manam emi, data load cheyam kabbati, direct ga internet, nunchi pull chesta, same like redis.
  rabbitmq:
    image: rabbitmq:3 # taking official rabbitmq docker image from docker hub
    container_name: rabbitmq
    # more info in official image [https://hub.docker.com/_/rabbitmq]
    #environment details in docker compose[https://docs.docker.com/compose/how-tos/environment-variables/set-environment-variables/] for below details
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123

    volumes:
    - rabbitmq:/var/lib/rabbitmq


  # payment details and enviroment variables
  payment:
    image: gangineninaveen/payment:v1
    container_name: payment
    environment:
      CART_HOST: cart
      CART_PORT: 8080
      USER_HOST: user
      USER_PORT: 8080
      AMQP_HOST: rabbitmq
      AMQP_USER: roboshop
      AMQP_PASS: roboshop123
    depends_on:
    - cart
    - user
    - rabbitmq


  # frontend
  frontend:
    image: gangineninaveen/frontend:v1
    container_name: frontend
    ports:
    - "80:80" #1st 80-> host port 2nd-> 80[container port]
    depends_on:
    - catalogue
    - user
    - cart
    - shipping
    - payment



